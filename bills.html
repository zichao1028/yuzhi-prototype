<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账单</title><link rel="stylesheet" href="styles.css"></head><body class=""><div class="nav">账单<a class="speclink" href="spec.html#bills">功能说明</a></div><div class="wrap"><div class="fwrap"><div class="fbar"><button id="fb-b">楼栋 ▾</button><button id="fb-s">账单状态 ▾</button><button id="fb-k">费用类型 ▾</button><button id="fb-f">支付日</button><button id="fb-o">排序 ▾</button></div><div class="drop" id="dd"></div></div><div class="dmask" id="dmask"></div><div class="helper" style="margin-bottom:8px"><span id="cnt"></span></div><div id="l"></div>
<div class="mask" id="mask"><div class="sheet"><div class="row"><b style="font-weight:600">支付日范围</b><a id="x">关闭</a></div><div class="daterow"><input class="input" type="date" id="d1"><span>~</span><input class="input" type="date" id="d2"></div><div class="btns"><button class="btn sec2" id="reset">重置</button><button class="btn" id="ok">确定</button></div></div></div></div><div class="tabbar"><a href="index.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 13 4l9 7.5"/><path d="M6.5 10v11h13V10"/><path d="M11 21v-5h4v5"/></svg>首页</a><a href="rooms.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h8v17"/><path d="M14 10h4v11"/><path d="M4 21h18"/><path d="M9 8h2M9 12h2M9 16h2"/></svg>房源</a><span aria-hidden="true"></span><a href="bills.html" class="act"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="14" height="17" rx="2.5"/><path d="M10 3.5h6v3h-6z"/><path d="M10 12h6M10 16h4"/></svg>账单</a><a href="me.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>我的</a></div><script src="bills-data.js"></script><script src="data.js"></script><script>
const S={b:'',s:'',k:'',o:'due',d1:'',d2:''};const SORTS={due:'支付日升序',od:'逾期优先'};const $=i=>document.getElementById(i);
const f=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
function render(){let r=BL.filter(x=>(!S.b||x.bld==S.b)&&(!S.s||x.status==S.s)&&(!S.k||x.k==S.k)&&(!S.d1||x.due>=S.d1)&&(!S.d2||x.due<=S.d2));
r.sort((a,b)=>(S.o=='od'?(b.overdue-a.overdue):0)||(a.due<b.due?-1:a.due>b.due?1:0));
$('cnt').textContent='共 '+r.length+' 笔账单 · '+SORTS[S.o];
$('l').innerHTML=r.map(x=>`<a class="card cc" href="${x.href}"><div class="ttl"><span class="addr">${x.addrs.join('、')}</span>${x.addrs.length>1?`<span class="n">共${x.addrs.length}间房</span>`:''}</div><div class="l2"><span>${x.who} · ${x.label}</span><b>¥${f(x.amount)}</b></div><div class="l2"><span>支付日 ${x.due}${x.overdue?' · 已逾期':''}</span><span class="tag">${x.status}</span></div></a>`).join('')||'<div class="helper">无符合条件的账单</div>';
[['fb-b',S.b||'楼栋'],['fb-s',S.s||'账单状态'],['fb-k',S.k||'费用类型']].forEach(([i,t])=>{$(i).textContent=t+' ▾';$(i).classList.toggle('act',t!=({'fb-b':'楼栋','fb-s':'账单状态','fb-k':'费用类型'})[i])});
$('fb-f').textContent='支付日'+(S.d1||S.d2?'(1)':'');$('fb-f').classList.toggle('act',!!(S.d1||S.d2));$('fb-o').classList.toggle('act',S.o!='due')}
let open='';function close(){$('dd').classList.remove('open');$('dmask').classList.remove('open');open=''}$('dmask').onclick=close;
function drop(kind,opts,key){const d=$('dd');if(open==kind){close();return}open=kind;$('dmask').classList.add('open');d.innerHTML=opts.map(([v,t])=>`<div data-v="${v}" class="${S[key]==v?'act':''}">${t}</div>`).join('');d.classList.add('open');d.querySelectorAll('div').forEach(x=>x.onclick=()=>{S[key]=x.dataset.v;close();render()})}
$('fb-b').onclick=()=>drop('b',[['','全部楼栋']].concat(Object.keys(BUILDINGS).map(b=>[b,b])),'b');
$('fb-s').onclick=()=>drop('s',[['','全部状态'],['待收','待收'],['部分收款','部分收款'],['已收','已收'],['已作废','已作废']],'s');
$('fb-k').onclick=()=>drop('k',[['','全部类型'],['租金','租金'],['押金','押金']],'k');
$('fb-o').onclick=()=>drop('o',Object.entries(SORTS),'o');
$('fb-f').onclick=()=>{close();$('d1').value=S.d1;$('d2').value=S.d2;$('mask').classList.add('open')};$('x').onclick=()=>$('mask').classList.remove('open');$('mask').onclick=e=>{if(e.target.id=='mask')$('mask').classList.remove('open')};
$('reset').onclick=()=>{$('d1').value='';$('d2').value=''};$('ok').onclick=()=>{S.d1=$('d1').value;S.d2=$('d2').value;$('mask').classList.remove('open');render()};render();</script></body></html>
