<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账单</title><link rel="stylesheet" href="styles.css"></head><body class=""><div class="nav">账单<a class="speclink" href="spec.html#bills">功能说明</a></div><div class="wrap"><div class="bhead"><span class="seg"><b id="sg-r" class="act">收款账单</b><b id="sg-p">付款账单</b></span><button class="mini" id="sbtn" aria-label="搜索">⌕</button></div><div id="sbox" style="display:none;margin-bottom:6px"><input class="input" id="sq" placeholder="搜索 承租人 / 房间地址"></div>
<div class="tabs" id="st3"><span data-v="todo" class="act">待收款</span><span data-v="done">已完成</span><span data-v="all">全部</span></div>
<div class="fwrap"><div class="fbar"><button id="fb-b">楼栋 ▾</button><button id="fb-k">账单类型 ▾</button><button id="fb-f">筛选 ▾</button></div><div class="drop" id="dd"></div></div><div class="dmask" id="dmask"></div>
<div class="sumrow"><div><span>总金额(元)</span><b id="s-t"></b></div><div><span id="s-pl">已收(元)</span><b id="s-p"></b></div><div><span id="s-dl">待收(元)</span><b id="s-d"></b></div></div>
<div class="chips2"><button class="mini" id="fb-dk">支付日 ▾</button><button class="mini" id="fb-d">选择日期范围</button></div>
<div id="l"></div><button class="fab" id="fab">批量<br>选择</button><div class="actionbar" id="bab" style="display:none"><span id="selc" class="helper"></span><button class="btn" id="bact" disabled>批量收款（待确认）</button></div>
<div class="mask" id="mask"><div class="sheet"><div class="row"><b style="font-weight:600">筛选</b><a id="x">关闭</a></div><label class="f">账单状态</label><div class="chips" id="fs"></div><div class="btns"><button class="btn sec2" id="reset">重置</button><button class="btn" id="ok">确定</button></div></div></div>
<div class="mask" id="maskd"><div class="sheet"><div class="row"><b style="font-weight:600">支付日范围</b><a id="xd">关闭</a></div><div class="daterow"><input class="input" type="date" id="d1"><span>~</span><input class="input" type="date" id="d2"></div><div class="btns"><button class="btn sec2" id="resetd">重置</button><button class="btn" id="okd">确定</button></div></div></div></div><div class="tabbar"><a href="index.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 13 4l9 7.5"/><path d="M6.5 10v11h13V10"/><path d="M11 21v-5h4v5"/></svg>首页</a><a href="rooms.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h8v17"/><path d="M14 10h4v11"/><path d="M4 21h18"/><path d="M9 8h2M9 12h2M9 16h2"/></svg>房源</a><span aria-hidden="true"></span><a href="bills.html" class="act"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="14" height="17" rx="2.5"/><path d="M10 3.5h6v3h-6z"/><path d="M10 12h6M10 16h4"/></svg>账单</a><a href="me.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>我的</a></div><script src="bills-data.js"></script><script src="data.js"></script><script>
const $=i=>document.getElementById(i);const f=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
const S={side:location.hash=='#pay'?'pay':'rec',tab:'todo',b:'',k:'',st:[],d1:'',d2:'',q:'',sel:false,picked:new Set()};
const TODO={rec:['待收','部分收款'],pay:['待付款']},DONE={rec:['已收','已完成'],pay:['已完成']};
const src=()=>S.side=='rec'?BL:PL;
function rows(){return src().filter(x=>(S.tab=='all'||(S.tab=='todo'?TODO[S.side]:DONE[S.side]).includes(x.status))&&(!S.b||x.bld==S.b)&&(!S.k||x.k==S.k)&&(!S.st.length||S.st.includes(x.status))&&(!S.d1||x.due>=S.d1)&&(!S.d2||x.due<=S.d2)&&(!S.q||(x.who+x.addrs.join('')).includes(S.q))).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:0)}
function render(){const r=rows();const P=S.side=='rec';
$('sg-r').classList.toggle('act',P);$('sg-p').classList.toggle('act',!P);document.querySelectorAll('#st3 span').forEach(e=>{e.classList.toggle('act',e.dataset.v==S.tab);if(e.dataset.v=='todo')e.textContent=P?'待收款':'待付款'});
$('s-pl').textContent=P?'已收(元)':'已付(元)';$('s-dl').textContent=P?'待收(元)':'待付(元)';
const tot=r.reduce((a,x)=>a+x.amount,0),paid=r.reduce((a,x)=>a+x.paid,0),due=r.filter(x=>TODO[S.side].includes(x.status)).reduce((a,x)=>a+x.amount-x.paid,0);
$('s-t').textContent=f(tot);$('s-p').textContent=f(paid);$('s-d').textContent=f(due);
$('fb-b').textContent=(S.b||'楼栋')+' ▾';$('fb-k').textContent=(S.k||'账单类型')+' ▾';$('fb-f').textContent='筛选'+(S.st.length?'('+S.st.length+')':'')+' ▾';$('fb-d').textContent=S.d1||S.d2?(S.d1||'…')+' 至 '+(S.d2||'…'):'选择日期范围';
$('l').innerHTML=r.map(x=>`<a class="card bc" data-h="${x.href}" href="${x.href}"><div class="bt"><span>${S.sel?`<input type="checkbox" ${S.picked.has(x.href)?'checked':''}> `:''}${x.k}${x.n?'·'+x.n+'期':''}·${x.who}</span><b>${f(x.amount)}</b></div><div class="bb"><div><div>账期: ${x.s?x.s+' 至 '+x.e:'—'}</div><div>支付日: ${x.due}</div><div class="ttl"><span class="addr">${x.addrs.join('、')}</span>${x.addrs.length>1?`<span class="n">共${x.addrs.length}间房</span>`:''}</div></div><div class="od">${x.odays?'逾期'+x.odays+'天':'<span class="tag">'+x.status+'</span>'}</div></div></a>`).join('')||'<div class="helper">无符合条件的账单</div>';
document.querySelectorAll('#l a.bc').forEach(a=>a.onclick=e=>{if(S.sel){e.preventDefault();const h=a.dataset.h;S.picked.has(h)?S.picked.delete(h):S.picked.add(h);render()}});
$('bab').style.display=S.sel?'flex':'none';$('selc').textContent='已选 '+S.picked.size+' 笔 · 文档无批量收款，暂不可用';$('fab').innerHTML=S.sel?'取消<br>选择':'批量<br>选择'}
let open='';function close(){$('dd').classList.remove('open');$('dmask').classList.remove('open');open=''}$('dmask').onclick=close;
function drop(kind,opts,key){const d=$('dd');if(open==kind){close();return}open=kind;$('dmask').classList.add('open');d.innerHTML=opts.map(([v,t])=>`<div data-v="${v}" class="${S[key]==v?'act':''}">${t}</div>`).join('');d.classList.add('open');d.querySelectorAll('div').forEach(x=>x.onclick=()=>{S[key]=x.dataset.v;close();render()})}
$('sg-r').onclick=()=>{S.side='rec';S.k='';S.st=[];S.picked.clear();render()};$('sg-p').onclick=()=>{S.side='pay';S.k='';S.st=[];S.picked.clear();render()};
document.querySelectorAll('#st3 span').forEach(e=>e.onclick=()=>{S.tab=e.dataset.v;render()});
$('fb-b').onclick=()=>drop('b',[['','全部楼栋']].concat(Object.keys(BUILDINGS).map(b=>[b,b])),'b');
$('fb-k').onclick=()=>drop('k',S.side=='rec'?[['','全部类型'],['租金','租金'],['押金','押金']]:[['','全部类型'],['退款','退款']],'k');
let tmp=[];function chips(){const vs=S.side=='rec'?['待收','部分收款','已收','已完成']:['待付款','已完成'];$('fs').innerHTML=vs.map(v=>`<span class="${tmp.includes(v)?'act':''}">${v}</span>`).join('');$('fs').querySelectorAll('span').forEach(s=>s.onclick=()=>{const i=tmp.indexOf(s.textContent);i<0?tmp.push(s.textContent):tmp.splice(i,1);chips()})}
$('fb-f').onclick=()=>{close();tmp=[...S.st];chips();$('mask').classList.add('open')};$('x').onclick=()=>$('mask').classList.remove('open');$('mask').onclick=e=>{if(e.target.id=='mask')$('mask').classList.remove('open')};$('reset').onclick=()=>{tmp=[];chips()};$('ok').onclick=()=>{S.st=tmp;$('mask').classList.remove('open');render()};
$('fb-dk').onclick=$('fb-d').onclick=()=>{close();$('d1').value=S.d1;$('d2').value=S.d2;$('maskd').classList.add('open')};$('xd').onclick=()=>$('maskd').classList.remove('open');$('maskd').onclick=e=>{if(e.target.id=='maskd')$('maskd').classList.remove('open')};$('resetd').onclick=()=>{$('d1').value='';$('d2').value=''};$('okd').onclick=()=>{S.d1=$('d1').value;S.d2=$('d2').value;$('maskd').classList.remove('open');render()};
$('sbtn').onclick=()=>{const b=$('sbox');b.style.display=b.style.display=='none'?'block':'none'};$('sq').oninput=e=>{S.q=e.target.value.trim();render()};
$('fab').onclick=()=>{S.sel=!S.sel;S.picked.clear();render()};render();</script></body></html>
