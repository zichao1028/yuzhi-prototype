document.getElementById('app').innerHTML=!r?'<div class="helper">暂无办理结果</div><a class="btn" href="contracts.html">去合同管理</a>':
`<div class="status"><div class="t">合同 ${r.old.id}：已终止</div><div class="s">终止原因：${r.reason} · 终止日 ${r.old.X} · 后续合同 ${r.nw.id}</div></div>
<div class="sec"><h3>合同 ${r.old.id} · 原合同</h3><div class="row"><span>合同房间</span><b>${r.old.rooms.join('、')}</b></div><div class="row"><span>结算应退</span><b>¥${f(r.old.tot)}</b></div><div class="helper">原合同账单留在合同 ${r.old.id}</div></div>
<div class="status on"><div class="t">合同 ${r.nw.id}：生效中</div><div class="s">来源：合同 ${r.old.id} ${r.type=='renew'?'续租':r.reason}后续签</div></div>

<div class="btns"><a class="btn sec2" href="contract-${r.old.id.toLowerCase()}.html">查看原合同 ${r.old.id}</a><a class="btn" href="contracts.html">合同管理</a></div><div class="helper" style="margin-top:12px">原型演示：结果未写入数据</div>`;</script></body></html>
