<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理结果</title><link rel="stylesheet" href="styles.css"></head><body class=""><div class="nav"><a class="back" href="contracts.html" aria-label="返回">‹ 返回</a>办理结果<a class="speclink" href="spec.html#result">功能说明</a></div><div class="wrap"><div id="app"></div></div><div class="tabbar"><a href="index.html" class="act"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 13 4l9 7.5"/><path d="M6.5 10v11h13V10"/><path d="M11 21v-5h4v5"/></svg>首页</a><a href="rooms.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h8v17"/><path d="M14 10h4v11"/><path d="M4 21h18"/><path d="M9 8h2M9 12h2M9 16h2"/></svg>房源</a><span aria-hidden="true"></span><a href="bills.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="14" height="17" rx="2.5"/><path d="M10 3.5h6v3h-6z"/><path d="M10 12h6M10 16h4"/></svg>账单</a><a href="me.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>我的</a></div><script>const r=JSON.parse(sessionStorage.getItem('res')||'null');const f=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
const tt=a=>`<div class="ttl"><span class="addr">${a.join('、')}</span>${a.length>1?`<span class="n">共${a.length}间房</span>`:''}</div>`;
document.getElementById('app').innerHTML=!r?'<div class="helper">暂无办理结果</div><a class="btn" href="contracts.html">去合同管理</a>':
`<div class="status"><div class="t">已终止</div><div class="s">终止原因：${r.reason} · 终止日 ${r.old.X}</div></div><div class="sec"><h3>原合同</h3>${tt(r.old.addrs)}<div class="helper">${r.old.start} 至 ${r.old.end} · ${r.old.who}</div><div class="row"><span>${r.old.tot>=0?'结算应退':'结算应补'}</span><b>¥${f(Math.abs(r.old.tot))}</b></div><div class="helper">原合同账单留在原合同</div></div>`+
(r.nw?`<div class="status on"><div class="t">生效中</div><div class="s">来源：${r.type=='renew'?'续租':r.reason}后续签</div></div><div class="sec"><h3>新合同</h3>${tt(r.nw.addrs)}<div class="row"><span>租期</span><b>${r.nw.start} 至 ${r.nw.end}</b></div><div class="row"><span>月租 / 押金</span><b>¥${f(r.nw.rent)} / ¥${f(r.nw.dep)} · ${r.nw.pay}</b></div><div class="row"><span>结转抵扣</span><b>¥${f(r.carry)}</b></div><div class="helper">新一组账单在新合同</div></div>`:'<div class="sec"><div class="helper">整单退租，不产生新合同</div></div>')+
`<div class="sec"><div class="row"><span>${r.cash>=0?'现金应退承租人':'承租人应补'}</span><span class="total">¥${f(Math.abs(r.cash))}</span></div></div><div class="btns"><a class="btn sec2" href="contract-${r.old.id.toLowerCase()}.html">查看原合同</a><a class="btn" href="contracts.html">合同管理</a></div><div class="helper" style="margin-top:8px">原型演示：结果未写入数据</div>`;</script></body></html>
