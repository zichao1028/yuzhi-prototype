<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理续租</title><link rel="stylesheet" href="styles.css"></head><body><div class="nav"><a class="back" href="index.html">‹ 返回</a>办理续租</div><div class="wrap"><div class="muted" id="prog" style="margin-bottom:8px"></div><div class="card stp"><div class="step">1 选择合同</div><select><option>H6 · 赵六 · 301 · 到期 2026-10-31</option></select></div><div class="card stp"><div class="step">2 新合同条款（将开始合同 H7）</div><div class="row"><span>房间</span><b>301</b></div><div class="row"><span>租期</span><b>2026-11-01 ~ 2027-10-31</b></div><label>月租<input type="number" value="1900"></label><label>押金<input type="number" value="1900"></label></div><div class="card stp"><div class="step">3 结算与结转</div><div class="row"><span>租金</span><b>已结清</b></div><div class="row"><span>押金应退</span><b>¥1800</b></div><label><input type="checkbox" name="k" value="d" checked style="width:auto"> H7 押金 ¥1900（结转 1800，余 100 待收）</label></div><div class="card stp"><div class="step">4 确认摘要</div><div>· 合同 H6 到期终止（终止原因：到期续租）</div><div>· 将开始合同 H7（房间 301，月租 1900）</div><div>· 结转 ¥1800 抵扣 H7 押金</div></div><div class="btns"><a class="btn ghost" id="prev">上一步</a><a class="btn" id="next">下一步</a></div></div><div class="tabbar"><a href="index.html" class="">合同</a><a href="tenancy-list.html" class="">租约</a><a href="checkout-flow.html" class="act">办理</a></div><script>const DONE='contract-h6.html'</script><script>
let s=0;const st=[...document.querySelectorAll('.stp')];
function show(){st.forEach((e,i)=>e.style.display=i==s?'block':'none');document.getElementById('prog').textContent='第 '+(s+1)+' / '+st.length+' 步';document.getElementById('prev').style.visibility=s?'visible':'hidden';document.getElementById('next').textContent=s==st.length-1?'确认办理':'下一步';if(window.calc)calc()}
document.getElementById('prev').onclick=()=>{s--;show()};
document.getElementById('next').onclick=()=>{if(window.check&&!check(s))return;if(s<st.length-1){s++;show()}else{alert('办理成功');location.href=DONE}};
document.querySelectorAll('input,select').forEach(e=>e.oninput=()=>window.calc&&calc());show();
</script></body></html>
