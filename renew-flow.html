<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理续租</title><link rel="stylesheet" href="styles.css"></head><body class="" data-type="renew"><div class="nav"><a class="back" href="contracts.html" aria-label="返回">‹ 返回</a>办理续租<a class="speclink" href="spec.html#renew">功能说明</a></div><div class="wrap form"><div id="app"></div></div><div class="tabbar"><a href="index.html" class="act"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 13 4l9 7.5"/><path d="M6.5 10v11h13V10"/><path d="M11 21v-5h4v5"/></svg>首页</a><a href="rooms.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h8v17"/><path d="M14 10h4v11"/><path d="M4 21h18"/><path d="M9 8h2M9 12h2M9 16h2"/></svg>房源</a><span aria-hidden="true"></span><a href="bills.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="14" height="17" rx="2.5"/><path d="M10 3.5h6v3h-6z"/><path d="M10 12h6M10 16h4"/></svg>账单</a><a href="me.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>我的</a></div><script src="data.js"></script><script>
const $=i=>document.getElementById(i),q=new URLSearchParams(location.search),T=document.body.dataset.type;
const f=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
const pd=s=>new Date(s+'T00:00:00'),ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},dim=(y,m)=>new Date(y,m+1,0).getDate();
const addY=s=>{const d=pd(s);return addD(ds(new Date(d.getFullYear()+1,d.getMonth(),d.getDate())),-1)};
const TODAY=ds(new Date());
const tt=a=>`<div class="ttl"><span class="addr">${a.join('、')}</span>${a.length>1?`<span class="n">共${a.length}间房</span>`:''}</div>`;
const c=DATA.find(x=>x.id==q.get('c'));
const replay=!!(c&&c.st=='已终止'&&c.flow==T);
if(!c||(!replay&&!['生效中','已到期'].includes(c.st))){$('app').innerHTML='<div class="helper">请从生效中或已到期合同的详情页发起办理。</div><a class="btn" href="contracts.html">去合同管理</a>';throw 0}
const pre={...c,end:c.oend||c.end,st:replay?'生效中':c.st};const expired=pre.st=='已到期';
const back='contract-'+c.id.toLowerCase()+'.html';document.querySelector('.nav .back').href=back;
const R={H1:{out:['303'],x:'2026-04-15',carry:[1,1]},H3:{out:['306'],inR:'307',x:'2026-05-31',carry:[1,0]},H6:{rent:1900,dep:1900,carry:[1,0]},H10:{out:['502'],x:'2026-05-31'}}[c.id]||{};
const A=r=>pre.bld+r;
function rentBetween(rent,a,b){if(a>b)return 0;let t=0,d=pd(a);const e=pd(b);while(d<=e){const y=d.getFullYear(),m=d.getMonth(),me=new Date(y,m,dim(y,m));const end=me<e?me:e;const days=Math.round((end-d)/864e5)+1;t+=days==dim(y,m)?rent:rent*days/dim(y,m);d=new Date(y,m+1,1)}return Math.round(t*100)/100}
function periodEnd(s0,step,day,cap){let s=pd(s0);for(let i=0;i<400;i++){const n=new Date(s.getFullYear(),s.getMonth()+step,s.getDate());n.setDate(n.getDate()-1);if(ds(n)>=day)return ds(n)<cap?ds(n):cap;s=new Date(n);s.setDate(s.getDate()+1)}return cap}
const occ=new Set(DATA.filter(x=>x.st=='生效中'||x.st=='已到期').flatMap(x=>x.rooms));
const vac=replay&&R.inR?[R.inR]:(BUILDINGS[c.bld]||[]).filter(r=>!occ.has(r)&&!pre.rooms.includes(r));
const single=pre.rooms.length==1;
const chk=(n,v,l,on,dis)=>`<label class="chk"><input type="checkbox" name="${n}" value="${v}" ${on?'checked':''} ${dis?'disabled':''}> ${l}</label>`;
const dX=R.x||(T=='renew'?pre.end:(expired?TODAY:(TODAY>pre.start?TODAY:pre.start)));
const maxX=expired?TODAY:pre.end;
const card=`<div class="status ${pre.st=='生效中'?'on':''}"><div class="t">${pre.st}${replay?'（办理前 · 回放）':''}</div><div class="s">${c.who} · ${pre.start} 至 ${pre.end} · 月租 ¥${f(pre.rent)} · ${pre.pay}${expired?' · 已超期':''}</div></div><div class="sec">${tt(pre.addrs)}</div>`;
const S=[];
if(T=='checkout')S.push({m:'all',t:'退租房间与退租日',h:(single?'<div class="helper">单间合同：整单退租</div>':'<div class="helper">全选 = 整单退租（不产生新合同）；部分勾选 = 部分退租（终止原合同并开始新合同）</div>')+pre.rooms.map(r=>chk('out',r,A(r),single||(R.out||[]).includes(r),single)).join('')+`<div class="helper" id="mode"></div><label class="f">退租日<input class="input" type="date" id="x" value="${dX}" min="${pre.start}" max="${maxX}"></label>${expired?'<div class="helper">合同已到期：到期日之后至退租日按原日租金计超期占用</div>':''}<div class="err-t" id="e1"></div>`});
if(T=='swap')S.push({m:'all',t:'换出房间、换入房间与换房日',h:pre.rooms.map(r=>chk('out',r,'换出 '+A(r),(R.out||[]).includes(r)||single)).join('')+`<label class="f">换入房间（同楼栋空置）<select class="input" id="inR">${vac.map(r=>`<option value="${r}">${A(r)}</option>`).join('')||'<option value="">本楼栋无空置房间</option>'}</select></label><label class="f">换房日（原合同终止日）<input class="input" type="date" id="x" value="${dX}" min="${pre.start}" max="${maxX}"></label><div class="err-t" id="e1"></div>`});
S.push({m:'partial',t:'新合同条款（将开始新合同）',h:`<div class="row"><span>合同房间</span></div><div id="nr"></div><div class="row"><span>起租日</span><b id="ns"></b></div><label class="f">到期日<input class="input" type="date" id="ne"></label><label class="f">月租（元）<input class="input" type="number" id="rent" value="${R.rent||pre.rent}"></label><div class="helper" id="rh"></div><label class="f">押金（元）<input class="input" type="number" id="dep" value="${R.dep||pre.dep}"></label><label class="f">付款方式<select class="input" id="pay"><option ${pre.pay=='按季'?'selected':''}>按季</option><option ${pre.pay=='按月'?'selected':''}>按月</option></select></label>${T=='renew'&&expired?'<div class="helper">已到期续租：新合同自原到期日次日起算，期间不计超期占用</div>':''}<div class="err-t" id="e2"></div>`});
S.push({m:'partial',t:'结算与结转',h:`<div class="sec" id="calc"></div><div class="step" style="margin-top:8px">结转抵扣新合同账单</div>${chk('k','dep','',R.carry?R.carry[0]:1)}${chk('k','first','',R.carry?R.carry[1]:0)}<div class="sec" id="carry" style="margin-top:8px"></div>`});
S.push({m:'whole',t:'结算（整单退租 · 现金结清）',h:'<div class="sec" id="calcw"></div><div class="sec" id="cashw"></div>'});
S.push({m:'all',t:'确认摘要',h:'<div id="sum"></div>'});
$('app').innerHTML=card+S.map((s,i)=>`<div class="stp" data-i="${i}"><div class="step" data-t="${s.t}"></div>${s.h}</div>`).join('')+'<div class="btns"><button class="btn sec2" id="prev">上一步</button><button class="btn" id="next">下一步</button></div>';
const st=[...document.querySelectorAll('.stp')];let cur=0,res,neEdited=false,rEdited=false,dEdited=false;$('ne').oninput=()=>neEdited=true;$('rent').oninput=()=>rEdited=true;$('dep').oninput=()=>dEdited=true;
const rr=r=>(pre.rr&&pre.rr[r]!=null)?pre.rr[r]:(LIST[r]||0);
function V(){const out=[...document.querySelectorAll('[name=out]:checked')].map(e=>e.value);const keep=pre.rooms.filter(r=>!out.includes(r));
const whole=T=='checkout'&&out.length==pre.rooms.length&&out.length>0;const X=T=='renew'?pre.end:$('x').value;const inR=T=='swap'?$('inR').value:'';return {out,keep,whole,X,inR}}
function active(){const v=V();return S.map((s,i)=>i).filter(i=>S[i].m=='all'||(S[i].m=='whole'?v.whole:(T!='checkout'||!v.whole)))}
function calc(){const v=V(),{out,keep,whole,X,inR}=v;
if($('mode'))$('mode').textContent=out.length==0?'':whole?'当前：整单退租':'当前：部分退租';
const nrooms=T=='checkout'?keep:T=='swap'?keep.concat(inR?[inR]:[]):pre.rooms;const naddr=nrooms.map(A);
if(T!='renew'){const sum=nrooms.reduce((a,r)=>a+rr(r),0);if(!rEdited)$('rent').value=sum;if(!dEdited)$('dep').value=sum;$('rh').textContent='默认 = 新合同各房间月租之和：'+nrooms.map(r=>A(r)+' '+rr(r)).join(' + ')+' = '+sum+'（可修改）'}
const ns=addD(X,1);if(!neEdited)$('ne').value=(T=='renew'||expired)?addY(ns):pre.end;const ne=$('ne').value;
const rent=+$('rent').value||0,dep=+$('dep').value||0,pay=$('pay').value;
let lines=[],tot;
if(T=='renew'){lines=[['租金','已结清'],['押金应退','¥'+f(pre.dep)]];tot=pre.dep}
else{const inEnd=X<pre.end?X:pre.end;const within=rentBetween(pre.rent,pre.start,inEnd);const over=X>pre.end?rentBetween(pre.rent,addD(pre.end,1),X):0;const rr=pre.paidRent-within;
lines=[['实际租金（'+pre.start+' 至 '+inEnd+'）','¥'+f(within)],['已收租金','¥'+f(pre.paidRent)],[rr>=0?'租金应退':'租金应补','¥'+f(Math.abs(rr))]];
if(over>0)lines.push(['超期占用（'+addD(pre.end,1)+' 至 '+X+'，按原日租金）','−¥'+f(over)]);lines.push(['押金应退','¥'+f(pre.dep)]);tot=rr+pre.dep-over}
lines.push([tot>=0?'合计应退':'合计应补','¥'+f(Math.abs(tot))]);
const lh=lines.map(l=>`<div class="row"><span>${l[0]}</span><b>${l[1]}</b></div>`).join('');
$('calc').innerHTML='<h3>原合同结算（终止日 '+X+'）</h3>'+lh;$('calcw').innerHTML='<h3>结算（终止日 '+X+'）</h3>'+lh;
$('cashw').innerHTML=`<div class="row"><span>${tot>=0?'现金应退承租人':'承租人应补'}</span><span class="total">¥${f(Math.abs(tot))}</span></div><div class="helper">整单退租不产生新合同，无结转</div>`;
const fe=periodEnd(T=='renew'?ns:pre.start,pay=='按季'?3:1,ns,ne||ns);const first=rentBetween(rent,ns,fe);
const k=[...document.querySelectorAll('[name=k]')];k[0].parentNode.lastChild.textContent=' 新合同押金 ¥'+f(dep);k[1].parentNode.lastChild.textContent=' 新合同首期租金（'+ns+' 至 '+fe+'）¥'+f(first);
const want=(k[0].checked?dep:0)+(k[1].checked?first:0);const carry=Math.max(0,Math.min(want,tot));const cash=tot-carry;
$('nr').innerHTML=naddr.length?tt(naddr):'—';$('ns').textContent=ns;
$('carry').innerHTML=`<div class="row"><span>结转抵扣</span><b>¥${f(carry)}</b></div>`+(want>carry?`<div class="row"><span>新合同账单剩余待收</span><b>¥${f(want-carry)}</b></div>`:'')+`<div class="row"><span>${cash>=0?'现金应退承租人':'承租人应补'}</span><span class="total">¥${f(Math.abs(cash))}</span></div>`;
const reason=T=='checkout'?(whole?'整单退租':'退租（房间 '+out.join('、')+'）'):T=='swap'?'换房（'+out.join('、')+' 换 '+inR+'）':'到期续租';
let sm=`<div class="sec"><div class="step">原合同将终止</div>${tt(pre.addrs)}<div class="helper">终止原因：${reason} · 终止日 ${X} · ${tot>=0?'结算应退':'结算应补'} ¥${f(Math.abs(tot))}</div></div>`;
if(whole)sm+=`<div class="sec"><div class="helper">不产生新合同</div><div class="row"><span>${tot>=0?'现金应退':'承租人应补'}</span><b>¥${f(Math.abs(tot))}</b></div></div>`;
else sm+=`<div class="sec"><div class="step">将开始新合同</div>${tt(naddr)}<div class="helper">来源：${T=='renew'?'续租':reason}后续签 · ${ns} 至 ${ne} · 月租 ¥${f(rent)} · 押金 ¥${f(dep)} · ${pay}，生成新一组账单</div></div><div class="sec"><div class="row"><span>结转抵扣新合同账单</span><b>¥${f(carry)}</b></div><div class="row"><span>${cash>=0?'现金应退':'承租人应补'}</span><b>¥${f(Math.abs(cash))}</b></div></div>`;
$('sum').innerHTML=sm+(replay?'<div class="helper">回放：确认后打开实际办理结果（原合同已终止）</div>':'<div class="helper">原型演示：确认后展示办理结果，数据不保存</div>');
res={reason,type:T,old:{id:c.id,addrs:pre.addrs,who:c.who,start:pre.start,end:pre.end,X,tot},nw:whole?null:{addrs:naddr,start:ns,end:ne,rent,dep,pay},carry:whole?0:carry,cash:whole?tot:cash};
return v}
function check(){const v=calc(),i=active()[cur];let m='';
if(S[i].t.startsWith('退租房间')||S[i].t.startsWith('换出')){if(T=='checkout'&&v.out.length==0)m='请至少勾选 1 间房';if(T=='swap'&&v.out.length!=1)m='一次换出 1 间房';if(T=='swap'&&!v.inR)m='本楼栋无空置房间，无法换房';if(!m&&(!v.X||v.X<pre.start||v.X>maxX))m='日期须在 '+pre.start+' 至 '+maxX+' 之间';$('e1').textContent=m;$('x').classList.toggle('err',m.startsWith('日期'))}
if(S[i].m=='partial'&&S[i].t.startsWith('新合同')){const ne=$('ne').value;if(!ne||ne<=addD(v.X,1))m='到期日须晚于起租日';else if(!(+$('rent').value>0))m='请填写月租';$('e2').textContent=m}
return !m}
function show(){const a=active();st.forEach(e=>e.style.display='none');const e=st[a[cur]];e.style.display='block';e.querySelector('.step').textContent='第 '+(cur+1)+' / '+a.length+' 步 · '+e.querySelector('.step').dataset.t;$('prev').style.visibility=cur?'visible':'hidden';$('next').textContent=cur==a.length-1?'确认办理':'下一步';calc()}
$('prev').onclick=()=>{cur--;show()};
$('next').onclick=()=>{if(!check())return;const a=active();if(cur<a.length-1){cur++;show();scrollTo(0,0)}else if(replay)location.href=back;else{sessionStorage.setItem('res',JSON.stringify(res));location.href='result.html'}};
document.addEventListener('input',calc);document.addEventListener('change',calc);show();
</script></body></html>
