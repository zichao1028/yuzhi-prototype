<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理换房</title><link rel="stylesheet" href="styles.css"></head><body><div class="nav"><a class="back" href="index.html">‹ 返回</a>办理换房</div><div class="wrap"><div class="muted" id="prog" style="margin-bottom:8px"></div><div class="card stp"><div class="step">1 选择合同</div><select><option>H3 · 王五 · E、F · 月租 2000 · 按月</option></select></div><div class="card stp"><div class="step">2 换出房间与换房日</div><label><input type="checkbox" name="r" value="E"  style="width:auto"> E</label><label><input type="checkbox" name="r" value="F" checked style="width:auto"> F</label><label>换入房间<select id="in"><option>G</option><option>H</option></select></label><label>换房日<input type="date" value="2026-05-31"></label></div><div class="card stp"><div class="step">3 新合同条款（将开始合同 H4）</div><div class="row"><span>房间</span><b id="rooms"></b></div><div class="row"><span>租期</span><b>2026-06-01 ~ 2026-12-31</b></div><label>月租<input type="number" value="2200"></label><label>押金<input type="number" value="2200"></label></div><div class="card stp"><div class="step">4 结算与结转</div><div class="row"><span>实际租金</span><b>2000 × 5 = ¥10000</b></div><div class="row"><span>已收租金</span><b>¥10000</b></div><div class="row"><span>押金应退</span><b>¥2000</b></div><label><input type="checkbox" name="k" value="d" checked style="width:auto"> H4 押金 ¥2200（结转 2000，余 200 待收）</label><div class="muted">现金应退 ¥0</div></div><div class="card stp"><div class="step">5 确认摘要</div><div id="sum"></div></div><div class="btns"><a class="btn ghost" id="prev">上一步</a><a class="btn" id="next">下一步</a></div></div><div class="tabbar"><a href="index.html" class="">合同</a><a href="tenancy-list.html" class="">租约</a><a href="checkout-flow.html" class="act">办理</a></div><script>const DONE='contract-h3.html';
function check(s){if(s==1){const n=document.querySelectorAll('[name=r]:checked').length;if(n!=1){alert('一次换一间房');return false}}return true}
function calc(){const r=[...document.querySelectorAll('[name=r]')],o=r.find(e=>e.checked),k=r.filter(e=>!e.checked).map(e=>e.value),i=document.getElementById('in').value;if(!o)return;
document.getElementById('rooms').textContent=k.concat(i).join('、');
document.getElementById('sum').innerHTML='<div>· 合同 H3 将终止（终止原因：换房（'+o.value+' 换 '+i+'），终止日 2026-05-31），结算应退 ¥2000</div><div>· 将开始合同 H4（房间 '+k.concat(i).join('、')+'），生成新一组账单</div><div>· 结转 ¥2000 抵扣 H4 押金，现金退还 ¥0</div>'}
</script><script>
let s=0;const st=[...document.querySelectorAll('.stp')];
function show(){st.forEach((e,i)=>e.style.display=i==s?'block':'none');document.getElementById('prog').textContent='第 '+(s+1)+' / '+st.length+' 步';document.getElementById('prev').style.visibility=s?'visible':'hidden';document.getElementById('next').textContent=s==st.length-1?'确认办理':'下一步';if(window.calc)calc()}
document.getElementById('prev').onclick=()=>{s--;show()};
document.getElementById('next').onclick=()=>{if(window.check&&!check(s))return;if(s<st.length-1){s++;show()}else{alert('办理成功');location.href=DONE}};
document.querySelectorAll('input,select').forEach(e=>e.oninput=()=>window.calc&&calc());show();
</script></body></html>
