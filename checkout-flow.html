<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理退租</title><link rel="stylesheet" href="styles.css"></head><body><div class="nav"><a class="back" href="index.html">‹ 返回</a>办理退租</div><div class="wrap"><div class="muted" id="prog" style="margin-bottom:8px"></div><div class="card stp"><div class="step">1 选择合同</div><select id="c"><option>H1 · 张三 · A、B、C · 月租 3000 · 按季</option></select></div><div class="card stp"><div class="step">2 退租房间与退租日</div><label><input type="checkbox" name="r" value="A"  style="width:auto"> A</label><label><input type="checkbox" name="r" value="B"  style="width:auto"> B</label><label><input type="checkbox" name="r" value="C" checked style="width:auto"> C</label><label>退租日（X）<input type="date" id="x" value="2026-04-15" min="2026-04-01" max="2026-06-30"></label><div class="muted">示例按 Q2 内的日期实时计算</div></div><div class="card stp"><div class="step">3 新合同条款（将开始合同 H2）</div><div class="row"><span>房间</span><b id="keep"></b></div><div class="row"><span>租期</span><b id="term"></b></div><label>月租<input id="rent" type="number" value="2000"></label><label>押金<input id="dep" type="number" value="2000"></label><label>付款方式<select><option>按季</option><option>按月</option></select></label></div><div class="card stp"><div class="step">4 结算与结转</div><div id="calc"></div><label><input type="checkbox" name="k" value="dep" checked style="width:auto"> H2 押金</label><label><input type="checkbox" name="k" value="first" checked style="width:auto"> H2 首期租金（X 次日 ~ 06-30）</label><div id="carry" class="muted"></div></div><div class="card stp"><div class="step">5 确认摘要</div><div id="sum"></div></div><div class="btns"><a class="btn ghost" id="prev">上一步</a><a class="btn" id="next">下一步</a></div></div><div class="tabbar"><a href="index.html" class="">合同</a><a href="tenancy-list.html" class="">租约</a><a href="checkout-flow.html" class="act">办理</a></div><script>const DONE='contract-h1.html';
const f=n=>n.toLocaleString('zh-CN',{maximumFractionDigits:2});
function check(s){const r=[...document.querySelectorAll('[name=r]:checked')];if(s==1&&(r.length==0||r.length==3)){alert('部分退租请勾选 1~2 间房；全部退租请走整份合同退租');return false}return true}
function calc(){const rs=[...document.querySelectorAll('[name=r]')],out=rs.filter(e=>e.checked).map(e=>e.value),keep=rs.filter(e=>!e.checked).map(e=>e.value);
const x=new Date(document.getElementById('x').value);const m=x.getMonth()+1,d=x.getDate(),dim=new Date(2026,m,0).getDate();
const nx=new Date(x);nx.setDate(d+1);const nxs=nx.toISOString().slice(0,10);
let act=0;for(let i=1;i<m;i++)act+=3000;act+=Math.round(3000*d/dim*100)/100;
const back=18000-act,tot=back+3000;const rent=+document.getElementById('rent').value,dep=+document.getElementById('dep').value;
let first=0;for(let i=m;i<=6;i++){const di=new Date(2026,i,0).getDate();first+=i==m?Math.round(rent*(di-d)/di*100)/100:rent}
const k=[...document.querySelectorAll('[name=k]')];let carry=(k[0].checked?dep:0)+(k[1].checked?first:0);carry=Math.min(carry,tot);
document.getElementById('keep').textContent=keep.join('、')+'（自动带出）';document.getElementById('term').textContent=nxs+' ~ 2026-12-31';
k[0].parentNode.lastChild.textContent=' H2 押金 ¥'+f(dep);k[1].parentNode.lastChild.textContent=' H2 首期租金（'+nxs.slice(5)+' ~ 06-30）¥'+f(first);
document.getElementById('calc').innerHTML='<div class="row"><span>实际租金</span><b>¥'+f(act)+'</b></div><div class="muted">'+(m-1)+' 个整月 × 3000 + '+m+' 月 3000×'+d+'/'+dim+'</div><div class="row"><span>已收租金</span><b>¥18000</b></div><div class="row"><span>租金应退</span><b>¥'+f(back)+'</b></div><div class="row"><span>押金应退</span><b>¥3000</b></div><div class="row"><span>合计应退</span><b>¥'+f(tot)+'</b></div>';
document.getElementById('carry').textContent='结转 ¥'+f(carry)+' · 现金应退 ¥'+f(tot-carry);
document.getElementById('sum').innerHTML='<div>· 合同 H1 将终止（终止原因：退租（房间 '+out.join('、')+'），终止日 '+document.getElementById('x').value+'），结算应退 ¥'+f(tot)+'</div><div>· 将开始合同 H2（房间 '+keep.join('、')+'，月租 '+rent+'，押金 '+dep+'），生成新一组账单</div><div>· 结转 ¥'+f(carry)+' 抵扣 H2 账单，现金退还 ¥'+f(tot-carry)+'</div><div class="muted">原型演示：确认后打开示例数据（X=04-15）的合同 H1</div>'}
</script><script>
let s=0;const st=[...document.querySelectorAll('.stp')];
function show(){st.forEach((e,i)=>e.style.display=i==s?'block':'none');document.getElementById('prog').textContent='第 '+(s+1)+' / '+st.length+' 步';document.getElementById('prev').style.visibility=s?'visible':'hidden';document.getElementById('next').textContent=s==st.length-1?'确认办理':'下一步';if(window.calc)calc()}
document.getElementById('prev').onclick=()=>{s--;show()};
document.getElementById('next').onclick=()=>{if(window.check&&!check(s))return;if(s<st.length-1){s++;show()}else{alert('办理成功');location.href=DONE}};
document.querySelectorAll('input,select').forEach(e=>e.oninput=()=>window.calc&&calc());show();
</script></body></html>
