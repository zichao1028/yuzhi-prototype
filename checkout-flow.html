<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>办理退租</title><link rel="stylesheet" href="styles.css"></head><body class="" data-type="checkout"><div class="nav"><a class="back" href="contracts.html" aria-label="返回">‹ 返回</a>办理退租<a class="speclink" href="spec.html#checkout">功能说明</a></div><div class="wrap form"><div id="app"></div></div><div class="tabbar"><a href="index.html" class="act"><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 13 4l9 7.5"/><path d="M6.5 10v11h13V10"/><path d="M11 21v-5h4v5"/></svg>首页</a><a href="rooms.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4h8v17"/><path d="M14 10h4v11"/><path d="M4 21h18"/><path d="M9 8h2M9 12h2M9 16h2"/></svg>房源</a><span aria-hidden="true"></span><a href="bills.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="5" width="14" height="17" rx="2.5"/><path d="M10 3.5h6v3h-6z"/><path d="M10 12h6M10 16h4"/></svg>账单</a><a href="me.html" class=""><svg viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="4"/><path d="M5 22c0-4.5 3.5-7 8-7s8 2.5 8 7"/></svg>我的</a></div><script src="data.js"></script><script>
const $=i=>document.getElementById(i),q=new URLSearchParams(location.search),T=document.body.dataset.type;
const f=n=>(Math.round(n*100)/100).toLocaleString('zh-CN',{maximumFractionDigits:2});
const pd=s=>new Date(s+'T00:00:00'),ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)},dim=(y,m)=>new Date(y,m+1,0).getDate();
const addY=s=>{const d=pd(s);return addD(ds(new Date(d.getFullYear()+1,d.getMonth(),d.getDate())),-1)};

const tt=a=>`<div class="ttl"><span class="addr">${a.join('、')}</span>${a.length>1?`<span class="n">共${a.length}间房</span>`:''}</div>`;
const c=DATA.find(x=>x.id==q.get('c'));
const replay=!!(c&&c.st=='已终止'&&c.flow==T);
if(!c||(!replay&&!['生效中','已到期'].includes(c.st))){$('app').innerHTML='<div class="helper">请从生效中或已到期合同的详情页发起办理。</div><a class="btn" href="contracts.html">去合同管理</a>';throw 0}
const pre={...c,end:c.oend||c.end,st:replay?'生效中':c.st};const expired=pre.st=='已到期';
const back='contract-'+c.id.toLowerCase()+'.html';document.querySelector('.nav .back').href=back;
const tm=c.term||{};const sc=tm.next?DATA.find(x=>x.id==tm.next):null;const si=tm.swapIn?DATA.find(x=>x.id==tm.swapIn):null;
const R=replay?{out:tm.out,inR:tm.inR,x:tm.X,rent:sc&&sc.rent,dep:sc&&sc.dep,ne:sc&&sc.oend,pay:sc&&sc.pay,srent:si&&si.rent,sdep:si&&si.dep,sne:si&&si.oend,spay:si&&si.pay,other:tm.other||0,ded:tm.ded||0,dedr:tm.dedr||'',carry:Object.fromEntries((tm.carry||[]).map(([id,bi,a])=>[(id==tm.swapIn?'s':'n')+bi,a]))}:{};
const A=r=>pre.bld+r;
const r2=x=>Math.round(x*100+1e-7)/100;const ms=(a,k)=>{const d=pd(a);const y=d.getFullYear(),m=d.getMonth()+k;return ds(new Date(y,m,Math.min(d.getDate(),dim(y,m))))};function rentBetween(rent,a,b){if(a>b)return 0;let k=0;while(addD(ms(a,k+1),-1)<=b)k++;const days=Math.round((pd(b)-pd(ms(a,k)))/864e5)+1;return r2(k*rent+rent*days/30)}
const PT={'按月':'付1压1','按季':'付3压1','按年':'付12压1'};const STEP={'按月':1,'按季':3,'按年':12};
const mea=(s,n)=>{const d=pd(s);return ds(new Date(d.getFullYear(),d.getMonth()+n,0))};
function genBills(start,end,rent,dep,pay){const out=[{label:'押金',amount:dep}];let s=start,i=1;while(s&&end&&s<=end&&i<200){let e=mea(s,STEP[pay]);if(e>end)e=end;out.push({label:'租金 第'+i+'期（'+s+' 至 '+e+'）',amount:rentBetween(rent,s,e)});s=addD(e,1);i++}return out}
const occ=new Set(DATA.filter(x=>x.st=='生效中'||x.st=='已到期').flatMap(x=>x.rooms));
const vac=replay&&R.inR?[R.inR]:(BUILDINGS[c.bld]||[]).filter(r=>!occ.has(r)&&!pre.rooms.includes(r));
const single=pre.rooms.length==1;
const chk=(n,v,l,on,dis)=>`<label class="chk"><input type="checkbox" name="${n}" value="${v}" ${on?'checked':''} ${dis?'disabled':''}> <span>${l}</span></label>`;
const dX=R.x||(T=='renew'?pre.end:(expired?TODAY:(TODAY>pre.start?TODAY:pre.start)));
const maxX=expired?TODAY:pre.end;
const recv=r2(c.bills.reduce((a,b)=>a+b.paid,0)-(replay?(c.bills.flatMap(b=>b.pays).filter(p=>p.m=='抵扣').reduce((a,p)=>a+p.amount,0)):0));
const card=`<div class="status ${pre.st=='生效中'?'on':''}"><div class="t">${pre.st}${replay?'（办理前 · 回放）':''}</div><div class="s">${c.who} · ${pre.start} 至 ${pre.end} · 月租 ¥${f(pre.rent)} · 押金 ¥${f(pre.dep)} · ${PT[pre.pay]}${expired?' · 已超期':''}</div></div><div class="sec">${tt(pre.addrs)}</div>`;
const paySel=(id,v)=>`<select class="input" id="${id}">${['按月','按季','按年'].map(p=>`<option value="${p}" ${v==p?'selected':''}>${PT[p]}</option>`).join('')}</select>`;
const S=[];
if(T=='checkout')S.push({m:'all',t:'退租房间与退租日',h:(single?'<div class="helper">单间合同：全部退租</div>':'<div class="helper">全选 = 全部退租（不产生新合同）；部分勾选 = 部分房间退租（原合同结算关闭，剩余房间开始剩余房间合同）</div>')+pre.rooms.map(r=>chk('out',r,A(r),single||(R.out||[]).includes(r),single)).join('')+`<div class="helper" id="mode"></div><label class="f">实际退租日<input class="input" type="date" id="x" value="${dX}" min="${pre.start}" max="${maxX}"></label><div class="err-t" id="e1"></div>`});
if(T=='swap')S.push({m:'all',t:'换出房间、换入房间与换房日',h:'<div class="helper">换房 = 换出房间退租（原合同结算关闭；有剩余房间时开始剩余房间合同）+ 换入房间单独租客登记一份新合同。一次只换 1 间。</div>'+pre.rooms.map(r=>chk('out',r,'换出 '+A(r),(R.out||[]).includes(r)||single,single)).join('')+`<label class="f">换入房间（同楼栋空置）<select class="input" id="inR">${vac.map(r=>`<option value="${r}">${A(r)}</option>`).join('')||'<option value="">本楼栋无空置房间</option>'}</select></label><label class="f">实际退租日（换房日）<input class="input" type="date" id="x" value="${dX}" min="${pre.start}" max="${maxX}"></label><div class="err-t" id="e1"></div>`});
S.push({m:'partial',t:T=='renew'?'续租新合同条款':'剩余房间合同条款',h:`<div class="row"><span>合同房间</span></div><div id="nr"></div><div class="row"><span>起租日</span><b id="ns"></b></div><label class="f">到期日<input class="input" type="date" id="ne"></label><label class="f">月租金（元，房东填写整份合同）<input class="input" type="number" id="rent" value="${R.rent||pre.rent}"></label><label class="f">押金（元）<input class="input" type="number" id="dep" value="${R.dep||pre.dep}"></label><label class="f">付款方式${paySel('pay',R.pay||pre.pay)}</label>${T!='renew'?'<div class="helper">签约方式沿用原合同（'+c.sign+'），不重新签约</div>':''}<div class="err-t" id="e2"></div>`});
if(T=='swap')S.push({m:'swapin',t:'换入房间合同条款（单独租客登记）',h:`<div class="row"><span>合同房间</span></div><div id="sr"></div><label class="f">起租日<input class="input" type="date" id="ss"></label><label class="f">到期日<input class="input" type="date" id="se"></label><label class="f">月租金（元）<input class="input" type="number" id="srent" value="${R.srent||''}"></label><label class="f">押金（元）<input class="input" type="number" id="sdep" value="${R.sdep||''}"></label><label class="f">付款方式${paySel('spay',R.spay||pre.pay)}</label><div class="err-t" id="e3"></div>`});
S.push({m:'all',t:'结算单',h:`<div class="sec" id="calc"></div><label class="f">随租金付的其他费用（元）<input class="input" type="number" id="oth" value="${R.other||0}"></label><label class="f">扣款（元）<input class="input" type="number" id="ded" value="${R.ded||0}"></label><label class="f">扣款原因<input class="input" id="dedr" value="${R.dedr||''}" placeholder="损坏、水电、其他"></label><div class="sec" id="res"></div><div class="err-t" id="e4"></div>`});
S.push({m:'carry',t:'抵扣新合同账单（房东选择）',h:`<div class="helper">选择要抵扣的新合同账单并填写金额：每张不超过其待收金额，合计不超过应退；未抵扣部分线下退还。可不抵扣。</div><div id="cb"></div><div class="sec" id="carry" style="margin-top:8px"></div><div class="err-t" id="e5"></div>`});
S.push({m:'all',t:'确认摘要',h:'<div id="sum"></div>'});
$('app').innerHTML=card+S.map((s,i)=>`<div class="stp" data-i="${i}"><div class="step" data-t="${s.t}"></div>${s.h}</div>`).join('')+'<div class="btns"><button class="btn sec2" id="prev">上一步</button><button class="btn" id="next">下一步</button></div>';
const st=[...document.querySelectorAll('.stp')];let cur=0,res,cbKey='';const ed={};['ne','ss','se'].forEach(i=>{if($(i))$(i).oninput=()=>ed[i]=true});
function V(){const out=[...document.querySelectorAll('[name=out]:checked')].map(e=>e.value);const keep=pre.rooms.filter(r=>!out.includes(r));
const whole=T=='checkout'&&out.length==pre.rooms.length&&out.length>0;const X=T=='renew'?pre.end:$('x').value;const inR=T=='swap'?$('inR').value:'';const hasRem=T=='renew'||(T=='checkout'?!whole:keep.length>0);return {out,keep,whole,X,inR,hasRem}}
let RES=0;
function active(){const v=V();return S.map((s,i)=>i).filter(i=>{const m=S[i].m;return m=='all'||(m=='partial'&&v.hasRem)||(m=='swapin'&&T=='swap')||(m=='carry'&&(v.hasRem||T=='swap')&&RES>0)})}
function calc(){const v=V(),{out,keep,whole,X,inR,hasRem}=v;
if($('mode'))$('mode').textContent=out.length==0?'':whole?'当前：全部退租':'当前：部分房间退租';
const nrooms=T=='renew'?pre.rooms:keep;const naddr=nrooms.map(A);
const ns=addD(X,1);if(!ed.ne)$('ne').value=R.ne||((T=='renew'||expired)?addY(ns):pre.end);const ne=$('ne').value;
const rent=+$('rent').value||0,dep=+$('dep').value||0,pay=$('pay').value;
let sw=null;if(T=='swap'){if(!ed.ss)$('ss').value=ns;if(!ed.se)$('se').value=R.sne||addY($('ss').value||ns);$('sr').innerHTML=inR?tt([A(inR)]):'—';
 sw={addrs:inR?[A(inR)]:[],start:$('ss').value,end:$('se').value,rent:+$('srent').value||0,dep:+$('sdep').value||0,pay:$('spay').value};}
const actual=rentBetween(pre.rent,pre.start,X);const oth=+$('oth').value||0,ded=+$('ded').value||0;const result=r2(recv-actual-oth-ded);RES=result;
$('calc').innerHTML=`<h3>原合同结算（${pre.start} 至 ${X}）</h3><div class="row"><span>已收合计（含押金）</span><b>¥${f(recv)}</b></div><div class="row"><span>实际租金（${pre.start} 至 ${X}）</span><b>−¥${f(actual)}</b></div>`;
$('res').innerHTML=`<div class="row"><span>结算结果 ${result>=0?'应退':'应收'}</span><span class="total">¥${f(Math.abs(result))}</span></div><div class="helper">${result>=0?'应退款可抵扣新合同账单，其余线下退还':'应收款留在原合同结算单上线下收取，不转入新合同'}</div>`;
const groups=[];if(hasRem)groups.push(['n',T=='renew'?'续租新合同':'剩余房间合同',naddr,genBills(ns,ne,rent,dep,pay)]);if(sw)groups.push(['s','换入房间合同',sw.addrs,genBills(sw.start,sw.end,sw.rent,sw.dep,sw.pay)]);
const key=JSON.stringify(groups.map(g=>g[3]));if(key!=cbKey){cbKey=key;$('cb').innerHTML=groups.map(([g,n,ad,bl])=>`<div class="sec"><h3>${n}</h3>${tt(ad)}`+bl.map((b,i)=>`<label class="f">${b.label} · 待收 ¥${f(b.amount)}<input class="input cin" type="number" data-k="${g}${i}" data-max="${b.amount}" value="${R.carry&&R.carry[g+i]||''}" placeholder="不抵扣"></label>`).join('')+'</div>').join('')}
const ins=[...document.querySelectorAll('.cin')];const used=ins.filter(e=>+e.value>0).map(e=>[e.dataset.k,+e.value,+e.dataset.max,e.parentNode.firstChild.textContent.split(' · ')[0]]);
const carry=result>0?r2(used.reduce((a,u)=>a+u[1],0)):0;const cash=r2(result-carry);
$('carry').innerHTML=`<div class="row"><span>抵扣合计</span><b>¥${f(carry)}</b></div><div class="row"><span>${cash>=0?'线下退还承租人':'承租人应补'}</span><span class="total">¥${f(Math.abs(cash))}</span></div>`;
$('nr').innerHTML=naddr.length?tt(naddr):'—';$('ns').textContent=ns;
const reason=T=='checkout'?(whole?'整单退租':'退租（房间 '+out.join('、')+'）'):T=='swap'?'换房（'+out.join('、')+' 换 '+inR+'）':'到期续租';
let sm=`<div class="sec"><div class="step">原合同结算并关闭</div>${tt(pre.addrs)}<div class="helper">终止原因：${reason} · 终止日 ${X} · 结算结果 ${result>=0?'应退':'应收'} ¥${f(Math.abs(result))}（其他费用 ¥${f(oth)}，扣款 ¥${f(ded)}）</div></div>`;
if(hasRem)sm+=`<div class="sec"><div class="step">${T=='renew'?'将开始续租新合同':'将开始剩余房间合同'}</div>${tt(naddr)}<div class="helper">来源：${T=='renew'?'续租':reason}后续签 · ${ns} 至 ${ne} · 月租 ¥${f(rent)} · 押金 ¥${f(dep)} · ${PT[pay]}，生成新一组账单</div></div>`;else if(T=='swap')sm+='<div class="sec"><div class="helper">原合同房间全部换出，无剩余房间合同</div></div>';else sm+='<div class="sec"><div class="helper">不产生新合同</div></div>';
if(sw)sm+=`<div class="sec"><div class="step">换入房间单独登记新合同</div>${tt(sw.addrs)}<div class="helper">新签（换房换入）· ${sw.start} 至 ${sw.end} · 月租 ¥${f(sw.rent)} · 押金 ¥${f(sw.dep)} · ${PT[sw.pay]}，生成新一组账单</div></div>`;
sm+=`<div class="sec"><div class="row"><span>抵扣新合同账单</span><b>¥${f(carry)}</b></div><div class="row"><span>${result>=0?'线下退还':'线下收取'}</span><b>¥${f(Math.abs(cash))}</b></div></div>`;
$('sum').innerHTML=sm+(replay?'<div class="helper">回放：确认后打开实际办理结果（原合同已终止）</div>':'<div class="helper">原型演示：确认后展示办理结果，数据不保存</div>');
res={reason,type:T,old:{id:c.id,addrs:pre.addrs,who:c.who,start:pre.start,end:pre.end,X,tot:result},nw:hasRem?{addrs:naddr,start:ns,end:ne,rent,dep,pay:PT[pay]}:null,sw:sw&&{...sw,pay:PT[sw.pay]},carry,cash};
return Object.assign(v,{used,carry,result})}
function check(){const v=calc(),i=active()[cur];let m='';
if(S[i].t.startsWith('退租房间')||S[i].t.startsWith('换出')){if(T=='checkout'&&v.out.length==0)m='请至少勾选 1 间房';if(T=='swap'&&v.out.length!=1)m='一次只能换 1 间房';if(T=='swap'&&!v.inR)m='本楼栋无空置房间，无法换房';if(!m&&(!v.X||v.X<pre.start||v.X>maxX))m='日期须在 '+pre.start+' 至 '+maxX+' 之间';$('e1').textContent=m}
if(S[i].m=='swapin'){const ss=$('ss').value,se=$('se').value;if(!ss||ss<=v.X)m='换入合同起租日须晚于换房日';else if(!se||se<=ss)m='到期日须晚于起租日';else if(!(+$('srent').value>0))m='请填写月租金';else if(!(+$('sdep').value>=0)||$('sdep').value==='')m='请填写押金';$('e3').textContent=m}
if(S[i].m=='partial'){const ne=$('ne').value;if(!ne||ne<=addD(v.X,1))m='到期日须晚于起租日';else if(!(+$('rent').value>0))m='请填写月租金';else if($('dep').value==='')m='请填写押金';$('e2').textContent=m}
if(S[i].t=='结算单'){if(+$('ded').value>0&&!$('dedr').value.trim())m='请填写扣款原因';if(+$('oth').value<0||+$('ded').value<0)m='金额不能为负';$('e4').textContent=m}
if(S[i].m=='carry'){const bad=v.used.find(u=>u[1]>u[2]+1e-9);if(bad)m=bad[3]+' 抵扣不能超过待收 ¥'+f(bad[2]);else if(v.carry>v.result+1e-9)m='抵扣合计不能超过应退 ¥'+f(v.result);$('e5').textContent=m}
return !m}
function show(){const a=active();if(cur>a.length-1)cur=a.length-1;st.forEach(e=>e.style.display='none');const e=st[a[cur]];e.style.display='block';e.querySelector('.step').textContent='第 '+(cur+1)+' / '+a.length+' 步 · '+e.querySelector('.step').dataset.t;$('prev').style.visibility=cur?'visible':'hidden';$('next').textContent=cur==a.length-1?'确认办理':'下一步';calc()}
$('prev').onclick=()=>{cur--;show()};
$('next').onclick=()=>{if(!check())return;const a=active();if(cur<a.length-1){cur++;show();scrollTo(0,0)}else if(replay)location.href=back;else{sessionStorage.setItem('res',JSON.stringify(res));location.href='result.html'}};
document.addEventListener('input',calc);document.addEventListener('change',calc);calc();show();
</script></body></html>
